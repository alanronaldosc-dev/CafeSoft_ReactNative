name: CI – Móvil React Native

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-sonar:
    name: Build (Expo) & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Validar build (Expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Análisis SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=alanronaldosc-dev_CafeSoft_ReactNative
            -Dsonar.organization=alanronaldosc-dev
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/android/**,**/ios/**
